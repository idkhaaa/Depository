<style> 
   .container-record { 
  font-family: sans-serif; 
    background: linear-gradient(135deg, #667eea, #764ba2); 
    color: #fff; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    height: 100vh; 
    margin: 0; 
    padding: 2rem; 
    border-radius: 12px; 
    box-shadow: 0 8px 24px rgba(0,0,0,0.3); 
    width: 100vw;
    text-align: center; 
  } 
  .h1-record { 
    margin-bottom: 1rem; 
    font-weight: 700; 
  } 
  .input-record[type="password"] { 
    width: 100%; 
    padding: 0.75rem 1rem; 
    border-radius: 8px; 
    border: none; 
    font-size: 1rem; 
    margin-bottom: 0.5rem; 
    outline: none; 
  } 
  .button-record, #downloadButton { 
    width: 100%; 
    padding: 0.75rem 1rem; 
    background-color: #4caf50; 
    border: none; 
    border-radius: 8px; 
    font-size: 1.1rem; 
    color: white; 
    cursor: pointer; 
    font-weight: 600; 
    transition: background-color 0.3s ease; 
    margin-top: 0.75rem; 
  } 
  .button-record:hover, #downloadButton:hover { 
    background-color: #45a049; 
  } 
  .error-message-record { 
    color: #ff6b6b; 
    margin-top: 0.5rem; 
    font-weight: 600; 
    height: 1.2em; 
  } 
  .iframe-record { 
    margin-top: 1rem; 
    width: 100%; 
    height: 500px; 
    border-radius: 12px; 
    border: none; 
  } 
</style> 
 
  <div class="container-record" id="app"> 
    <h1 class="h1-record">Enter Password to View Excel</h1> 
    <input class="input-record" type="password" id="passwordInput" placeholder="Enter password" /> 
    <button class="button-record" id="viewButton">View</button> 
    <div class="error-message" id="errorMessage"></div> 
    <div id="iframeContainer" style="display:none;"> 
      <iframe  
        class="iframe-record" 
        src="https://view.officeapps.live.com/op/embed.aspx?src=https%3A%2F%2Fstorage.googleapis.com%2Fplayground-bucket-v2.teleporthq.io%2F559af23a-6404-4baf-8bc0-c5496120f476%2F1a491ddb-aafd-419c-9398-0423ab457cae"  
        id="excelFrame"  
        title="Excel File Viewer"> 
      </iframe> 
      <button id="downloadButton" style="display:none;">Download Excel File</button> 
    </div> 
  </div> 
 
<script> 
  (function(){ 
    const correctPassword = 'secret123';
    const excelFileUrl = 'https://storage.googleapis.com/playground-bucket-v2.teleporthq.io/559af23a-6404-4baf-8bc0-c5496120f476/1a491ddb-aafd-419c-9398-0423ab457cae';
    const input = document.getElementById('passwordInput'); 
    const button = document.getElementById('viewButton'); 
    const errorMessage = document.getElementById('errorMessage'); 
    const iframeContainer = document.getElementById('iframeContainer'); 
    const downloadButton = document.getElementById('downloadButton'); 
 
    function validatePassword() { 
      const entered = input.value; 
      if (entered === correctPassword) { 
        errorMessage.textContent = ''; 
        iframeContainer.style.display = 'block'; 
        downloadButton.style.display = 'block'; 
        input.style.display = 'none'; 
        button.style.display = 'none'; 
      } else { 
        errorMessage.textContent = 'Incorrect password. Please try again.'; 
      } 
    } 
 
    button.addEventListener('click', validatePassword); 
    input.addEventListener('keyup', function(event){ 
      if(event.key === 'Enter'){ 
        validatePassword(); 
      } 
    }); 
 
    downloadButton.addEventListener('click', function(){ 
      const a = document.createElement('a'); 
      a.href = excelFileUrl; 
      a.download = '';  
      document.body.appendChild(a); 
      a.click(); 
      document.body.removeChild(a); 
    }); 
  })(); 
</script>
